# /etc/nginx/conf.d/ainexus.conf
# AiNexus frontend + Spring Boot gateway, HTTPS enabled with HTTP redirect.

# HTTP 强制跳转到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ainexus.b509.cn;

    return 301 https://$host$request_uri;
}

# 核心 HTTPS 服务
server {
    # http2: 多请求并行加载，加快首屏资源获取
    # nginx >= 1.25.1 建议改为分开写: listen 443 ssl; 加一行 http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ainexus.b509.cn;

    # SSL 证书配置
    ssl_certificate /opt/docker/conf/c_tengine/common/crt/b509.pem;
    ssl_certificate_key /opt/docker/conf/c_tengine/common/crt/b509.key;

    # 推荐的 SSL 安全优化配置（可选，但建议保留）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # TLS 会话复用：刷新页面时免去重复握手
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ===== 压缩：JS/CSS 传输体积降到原来的 1/3 ~ 1/4 =====
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # 若部署时上传了同名的 .gz 预压缩文件则直接使用（没有也不影响）
    gzip_static on;

    root /opt/ainexus/fronted;
    index index.html;

    # Allow the configured gateway payload limit plus a small margin.
    client_max_body_size 128m;

    # ===== 带哈希的静态资源：强缓存一年 + immutable =====
    # 文件名带内容哈希（如 index-EVPvvv-D.js），内容变了文件名就变，
    # 所以可以放心缓存一年；刷新时浏览器直接用本地缓存，零传输。
    # 注意：缺失的旧哈希文件直接 404，绝不能回退到 index.html（否则 JS 请求拿到 HTML 报 MIME 错误）。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ===== index.html 禁止缓存 =====
    # 保证发新版时浏览器能立刻拿到引用了新哈希文件的 HTML。
    # no-cache = 每次向后端协商校验（ETag 变了才重下），HTML 本身很小，代价可忽略。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Static Vue SPA assets.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browser console APIs: /api/* -> Spring Boot /api/*
    location /api/ {
        proxy_pass http://10.0.32.2:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 这里的 $scheme 现在会自动传递 https，Spring Boot 会正确识别
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # OpenAI-compatible gateway: /v1/* -> Spring Boot /v1/*
    # Buffering must remain disabled for streaming chat completion SSE responses.
    location /v1/ {
        proxy_pass http://10.0.32.2:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Do not expose Spring Boot actuator endpoints through the public domain.
    location /actuator/ {
        return 404;
    }
}
