# /etc/nginx/conf.d/ainexus.conf
# AiNexus frontend + Spring Boot gateway, HTTP only.

server {
    listen 80;
    listen [::]:80;
    server_name ainexus.b509.cn;

    root /opt/ainexus/fronted;
    index index.html;

    # Allow the configured gateway payload limit plus a small margin.
    client_max_body_size 128m;

    # Static Vue SPA assets.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browser console APIs: /api/* -> Spring Boot /api/*
    location /api/ {
        proxy_pass http://127.0.0.1:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # OpenAI-compatible gateway: /v1/* -> Spring Boot /v1/*
    # Buffering must remain disabled for streaming chat completion SSE responses.
    location /v1/ {
        proxy_pass http://127.0.0.1:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Do not expose Spring Boot actuator endpoints through the public domain.
    location /actuator/ {
        return 404;
    }
}
